name: Build Android Release Bundle (.aab)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          cd client
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x client/android/gradlew

      - name: Build Release Bundle (.aab)
        run: |
          cd client/android
          ./gradlew bundleRelease

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: client/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload APK (For direct phone testing)
        run: |
          cd client/android
          ./gradlew assembleDebug
        continue-on-error: true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: client/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
